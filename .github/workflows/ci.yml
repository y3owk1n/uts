on:
    pull_request:
        branches: ["*"]
        # Release-please PRs only bump versions in CHANGELOG/manifest files.
        # The underlying code was already validated when the feature PRs merged
        # to main, so running the full CI matrix again is pure waste.
        paths-ignore:
            - "CHANGELOG.md"
            - ".release-please-manifest.json"
            - "release-please-config.json"
name: CI
permissions:
    contents: read
    pull-requests: read
jobs:
    checks:
        name: ${{ matrix.check }} (${{ matrix.os }})
        strategy:
            matrix:
                os: [macos-latest, ubuntu-latest]
                check: [lint, vet, test, build]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.head_ref }}

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: "go.mod"
                  cache: true

            # Install only, the lint step runs it
            - name: Setup Golangci
              if: matrix.check == 'lint'
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.12.2
                  install-only: true

            - name: Install just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
              with:
                  just-version: "1.54.0"

            - name: Run just lint
              if: matrix.check == 'lint'
              run: just lint

            - name: Run just vet
              if: matrix.check == 'vet'
              run: just vet

            - name: Run just build
              if: matrix.check == 'build'
              run: just build

            - name: Run just test-all
              if: matrix.check == 'test'
              run: just test-all
