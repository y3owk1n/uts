on:
    pull_request:
        branches: ["*"]
        # Release-please PRs only bump versions in CHANGELOG/manifest files.
        # The underlying code was already validated when the feature PRs merged
        # to main, so running the full CI matrix again is pure waste.
        paths-ignore:
            - "CHANGELOG.md"
            - ".release-please-manifest.json"
            - "release-please-config.json"
name: CI
permissions:
    contents: read
    pull-requests: read
jobs:
    checks:
        name: ${{ matrix.check }} (${{ matrix.os }})
        strategy:
            matrix:
                os: [macos-latest, ubuntu-latest]
                check: [lint, vet, test, build]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.head_ref }}

            # oku installs go, golangci-lint and just at the versions oku.lock
            # pins. The action installs the oku release of its own tag.
            - name: Setup the toolchain
              uses: y3owk1n/oku@v0.6.1
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Run just lint
              if: matrix.check == 'lint'
              run: just lint

            - name: Run just vet
              if: matrix.check == 'vet'
              run: just vet

            - name: Run just build
              if: matrix.check == 'build'
              run: just build

            - name: Run just test-all
              if: matrix.check == 'test'
              run: just test-all
